services:
  app:
    build: ./y_money
    container_name: y-money-app
    restart: always
    entrypoint: >
      sh -c "python manage.py migrate --noinput &&
            python manage.py collectstatic --noinput &&
            uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --workers 3"
    env_file:
      - .env
    volumes:
      - static_volume:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      y_money_network:
        ipv4_address: 172.21.0.10
      npm-network:

  db:
    image: postgres:16
    container_name: y-money-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      y_money_network:
        ipv4_address: 172.21.0.20 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.0
    restart: always
    volumes:
      - redis_data:/data
    networks:
      y_money_network:
        ipv4_address: 172.21.0.30
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  y_money_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/24
          gateway: 172.21.0.1
  npm-network:
    external: true

volumes:
  db_data:
  redis_data:
  static_volume:
